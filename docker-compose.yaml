services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    container_name: otel-collector

    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml 

    ports:
      - "4317:4317"
      - "4318:4318"

  jaeger:
    container_name: jaeger-container
    image: jaegertracing/all-in-one
    ports:
      - 6831:6831/udp # jaeger agent - thrifty comapct
      - 6832:6832/udp # jaeger agent - thrifty binary
      - 5778:5778 # configs
      - 16686:16686 # jaeger UI
      - 14268:14268  # collector (otlp http / thrifty )
      - 14250:14250 # grpc

  prometheus:
    image: prom/prometheus
    container_name: prometheus-for-otel-col
    ports:
      - 9095:9090
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml

    command:  # to enable remote write
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--web.enable-remote-write-receiver"
    depends_on:
      - otel-collector